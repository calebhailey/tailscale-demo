global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s

resolvers container_dns
  parse-resolv-conf
  resolve_retries 3
  timeout retry 1s
  hold valid 10s

frontend http
  bind :8080
  monitor-uri /haproxy/healthz
  monitor fail if { nbsrv(app) eq 0 }
  acl static_asset path_end -i .css .js
  use_backend static if static_asset
  default_backend app

backend app
  balance roundrobin

  option httpchk
  http-check send meth GET uri /api/readyz ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server inter 5s fall 1 rise 1

  # Container DNS returns every scaled `app` replica. HAProxy polls each target
  # and withdraws it from round-robin selection when /api/readyz returns 503.
  server-template app 3 app:8080 check resolvers container_dns resolve-prefer ipv4 init-addr none

backend static
  balance roundrobin

  option httpchk
  http-check send meth GET uri /api/readyz ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server inter 5s fall 1 rise 1

  # Use a separate rotation for cacheable static assets so page navigations
  # rotate independently across the application fleet.
  server-template static 3 app:8080 check resolvers container_dns resolve-prefer ipv4 init-addr none
